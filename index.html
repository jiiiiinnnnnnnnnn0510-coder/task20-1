<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시 문화행사 알리미</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f5f7fa;
    }

    header {
      background-color: #234b84;
      color: white;
    }

    .search-panel {
      background-color: white;
      border-radius: 12px;
    }

    .event-card {
      height: 100%;
      overflow: hidden;
    }

    .event-image {
      width: 100%;
      height: 290px;
      object-fit: contain;
      background-color: #edf0f4;
    }

    .image-placeholder {
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #edf0f4;
      color: #6c757d;
    }

    .card-title {
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header class="py-4 mb-4">
    <div class="container">
      <h1 class="h3 mb-2">서울시 문화행사 알리미</h1>
      <p class="mb-0">공연분야를 선택하여 서울의 문화행사를 확인하세요.</p>
    </div>
  </header>

  <main class="container pb-5">
    <section class="search-panel shadow-sm p-4 mb-4">
      <form id="searchForm" class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <label for="gu" class="form-label">공연분야</label>
          <select id="gu" class="form-select" disabled>
            <option value="">전체 공연분야</option>
          </select>
        </div>

        <div class="col-12 col-md-6">
          <label for="keyword" class="form-label">행사명 검색</label>
          <input
            id="keyword"
            type="search"
            class="form-control"
            placeholder="검색어를 입력하세요"
          >
        </div>

        <div class="col-12 col-md-2">
          <button
            id="searchButton"
            type="submit"
            class="btn btn-primary w-100"
            disabled
          >
            검색
          </button>
        </div>
      </form>
    </section>

    <p id="status" class="text-secondary" role="status" aria-live="polite">
      문화행사 정보를 불러오는 중입니다.
    </p>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <section
      id="eventList"
      class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"
      aria-label="문화행사 검색 결과"
    ></section>

    <div class="text-center mt-4">
      <button id="moreButton" class="btn btn-outline-primary d-none">
        더 보기
      </button>
    </div>
  </main>

  <script>
    const select = document.getElementById("gu");
    const keywordInput = document.getElementById("keyword");
    const searchButton = document.getElementById("searchButton");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const eventList = document.getElementById("eventList");
    const moreButton = document.getElementById("moreButton");

    const PAGE_SIZE = 12;

    let allEvents = [];
    let filteredEvents = [];
    let displayedCount = 0;

    // API의 문자열을 HTML로 해석하지 않고 텍스트로 표시한다.
    function makeElement(tag, className, value) {
      const element = document.createElement(tag);
      element.className = className;

      if (value !== undefined) {
        element.textContent = value;
      }

      return element;
    }

    // 링크와 이미지에는 HTTP 또는 HTTPS 주소만 허용한다.
    function safeUrl(value) {
      if (!value) return null;

      try {
        const url = new URL(value);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch {
        return null;
      }

      return null;
    }

    function createCard(event) {
      const column = makeElement("div", "col");
      const card = makeElement("article", "card event-card shadow-sm");

      const imageUrl = safeUrl(event.MAIN_IMG);
      const placeholder = makeElement(
        "div",
        "image-placeholder",
        "포스터 이미지 없음"
      );

      if (imageUrl) {
        const image = makeElement("img", "event-image");
        image.src = imageUrl;
        image.alt = `${event.TITLE || "문화행사"} 포스터`;
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.replaceWith(placeholder);
        }, { once: true });

        card.append(image);
      } else {
        card.append(placeholder);
      }

      const body = makeElement("div", "card-body d-flex flex-column");
      const badges = makeElement("div", "mb-2");

      badges.append(
        makeElement(
          "span",
          "badge text-bg-primary me-1",
          event.CODENAME || "분야 미등록"
        ),
        makeElement(
          "span",
          "badge text-bg-secondary",
          event.GUNAME || "지역 미등록"
        )
      );

      body.append(
        badges,
        makeElement("h2", "card-title", event.TITLE || "제목 없음")
      );

      const details = [
        ["기간", event.DATE],
        ["장소", event.PLACE],
        ["대상", event.USE_TRGT],
        ["요금", event.USE_FEE ||
          (event.IS_FREE === "무료" ? "무료" : "상세 안내 확인")]
      ];

      details.forEach(([label, value]) => {
        body.append(
          makeElement(
            "p",
            "small mb-2",
            `${label}: ${value || "정보 없음"}`
          )
        );
      });

      const detailUrl =
        safeUrl(event.HMPG_ADDR) || safeUrl(event.ORG_LINK);

      if (detailUrl) {
        const link = makeElement(
          "a",
          "btn btn-outline-primary btn-sm mt-auto",
          "상세정보 보기"
        );

        link.href = detailUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        body.append(link);
      }

      card.append(body);
      column.append(card);

      return column;
    }

    function renderMore() {
      const nextEvents = filteredEvents.slice(
        displayedCount,
        displayedCount + PAGE_SIZE
      );

      const fragment = document.createDocumentFragment();

      nextEvents.forEach(event => {
        fragment.append(createCard(event));
      });

      eventList.append(fragment);
      displayedCount += nextEvents.length;

      moreButton.classList.toggle(
        "d-none",
        displayedCount >= filteredEvents.length
      );

      status.textContent =
        `검색 결과 ${filteredEvents.length.toLocaleString()}건` +
        ` · 현재 ${displayedCount.toLocaleString()}건 표시`;
    }

    function searchEvents() {
      const category = select.value;
      const keyword = keywordInput.value.trim().toLocaleLowerCase("ko");

      filteredEvents = allEvents.filter(event => {
        const matchesCategory =
          category === "" || event.CODENAME === category;

        const matchesKeyword =
          String(event.TITLE || "")
            .toLocaleLowerCase("ko")
            .includes(keyword);

        return matchesCategory && matchesKeyword;
      });

      eventList.replaceChildren();
      displayedCount = 0;

      renderMore();

      if (filteredEvents.length === 0) {
        eventList.append(
          makeElement(
            "p",
            "col-12 text-secondary",
            "검색 조건에 해당하는 문화행사가 없습니다."
          )
        );
      }
    }

    async function loadEvents() {
      try {
        const response = await fetch("/.netlify/functions/events");

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "문화행사 조회에 실패했습니다.");
        }

        if (!Array.isArray(data.events)) {
          throw new Error("응답 데이터 형식이 올바르지 않습니다.");
        }

        allEvents = data.events;

        console.log("전체 문화행사 데이터:", allEvents);

        // 전체 데이터의 CODENAME을 추출하고 중복을 제거한다.
        const categories = [...new Set(
          allEvents
            .map(event => event.CODENAME)
            .filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "ko"));

        console.log("전체 공연분야(CODENAME):", categories);

        categories.forEach(category => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          select.append(option);
        });

        select.disabled = false;
        searchButton.disabled = false;

        searchEvents();
      } catch (error) {
        status.textContent = "문화행사 정보를 불러오지 못했습니다.";
        errorBox.textContent = error.message;
        errorBox.classList.remove("d-none");
        console.error(error);
      }
    }

    document.getElementById("searchForm")
      .addEventListener("submit", event => {
        event.preventDefault();
        searchEvents();
      });

    select.addEventListener("change", searchEvents);
    moreButton.addEventListener("click", renderMore);

    loadEvents();
  </script>
</body>
</html>
